<p-carousel
  [value]="images()"
  [numVisible]="1"
  [numScroll]="1"
  [circular]="true"
  [showIndicators]="true"
  [showNavigators]="true"
>
  <ng-template pTemplate="item" let-image>
    <div class="carousel-item">
      <img
        [src]="image"
        loading="eager"
        decoding="async"
        alt="Carousel image"
        class="carousel-image"
      />
    </div>
  </ng-template>
</p-carousel>
